header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }

.container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
.tabs { display: flex; gap: 6px; margin-bottom: 1.75rem; flex-wrap: wrap; }

let currentDay = 'Lunes';
let currentView = 'semanal';
let weekSelectedDay = null;

function showView(v) {
  currentView = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  const tabs = document.querySelectorAll('.tab');
  const idx = ['semanal','diaria','compra'].indexOf(v);
  if (idx >= 0) tabs[idx].classList.add('active');
}

function buildDayDetail(day, containerId) {
  const meals = MEALS[day];
  if (!meals) return;
  const allIngreds = [];
  let html = '<div class="day-title">' + day + '</div>';
  Object.keys(MEAL_LABELS).forEach(mkey => {
    const items = meals[mkey];
    if (!items || items.length === 0) return;
    const label = MEAL_LABELS[mkey];
    const time = MEAL_TIMES[mkey];
    items.forEach(p => {
      const ingList = p.ingredientes.split(',').map(s => s.trim());
      ingList.forEach(i => { if (i && !allIngreds.includes(i)) allIngreds.push(i); });
    });
    const midx = Object.keys(MEAL_LABELS).indexOf(mkey);
    html += '<div class="meal-block"><div class="meal-header" onclick="toggleMeal(this)">';
    html += '<div><div class="meal-label">' + label + '</div><div class="meal-time">' + time + '</div></div>';
    html += '<span class="chevron">▼</span></div>';
    html += '<div class="meal-body">';
    items.forEach(p => {
      html += '<div class="plato">';
      html += '<div class="plato-name">' + p.nombre + '</div>';
      html += '<div class="ingred-list">' + p.ingredientes + '</div>';
      if (p.elaboracion) {
        html += '<div class="elab"><div class="elab-label">Elaboración</div>' + p.elaboracion + '</div>';
      }
      if (p.video) {
        html += '<a class="video-link" href="' + p.video + '" target="_blank">▶ Ver receta en YouTube</a>';
      }
      html += '</div>';
    });
    html += '</div></div>';
  });
  if (allIngreds.length > 0) {
    html += '<div class="ingred-day-section"><div class="ingred-day-title">🧺 Ingredientes del día</div>';
    allIngreds.forEach(i => { html += '<span class="ingred-tag">' + i + '</span>'; });
    html += '</div>';
  }
  document.getElementById(containerId).innerHTML = '<div class="day-detail">' + html + '</div>';
}

function toggleMeal(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.chevron');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function buildWeekGrid() {
  let html = '';
  DAYS.forEach(day => {
    const meals = MEALS[day];
    let mini = '';
    ['desayuno','almuerzo','cena'].forEach(mkey => {
      if (meals[mkey] && meals[mkey].length > 0) {
        mini += '<span class="mini-label">' + MEAL_LABELS[mkey] + '</span>';
        meals[mkey].slice(0,2).forEach(p => { mini += '<span>' + p.nombre + '</span>'; });
      }
    });
    html += '<div class="day-card" onclick="selectWeekDay(\'' + day + '\')">';
    html += '<div class="day-name">' + day.toUpperCase() + '</div>';
    html += '<div class="meal-mini">' + mini + '</div></div>';
  });
  document.getElementById('weekGrid').innerHTML = html;
}

function selectWeekDay(day) {
  weekSelectedDay = day;
  document.querySelectorAll('.day-card').forEach((card, i) => {
    card.classList.toggle('selected', DAYS[i] === day);
  });
  buildDayDetail(day, 'weekDayDetail');
}

function buildDayButtons() {
  let html = '';
  DAYS.forEach(day => {
    html += '<div class="day-btn" onclick="selectDay(\'' + day + '\')">' + day + '</div>';
  });
  document.getElementById('dayButtons').innerHTML = html;
}

function selectDay(day) {
  currentDay = day;
  document.querySelectorAll('.day-btn').forEach((btn, i) => {
    btn.classList.toggle('active', DAYS[i] === day);
  });
  buildDayDetail(day, 'dayDetail');
}

function rebuildCompraUI() {
  const grid = document.getElementById('compraGrid');
  if (!grid) return;
  let html = '';
  let total = 0; let checked = 0;
  Object.keys(COMPRA).forEach(cat => {
    const items = COMPRA[cat];
    if (!items || items.length === 0) return;
    html += '<div class="compra-cat"><div class="cat-title">' + cat + '</div>';
    items.forEach(item => {
      total++;
      const isChecked = checkedItems.has(item);
      if (isChecked) checked++;
      html += '<div class="compra-item' + (isChecked ? ' done' : '') + '" onclick="toggleItem(\'' + item.replace(/'/g, "\\'") + '\')">';
      html += '<div class="check' + (isChecked ? ' checked' : '') + '">' + (isChecked ? '✓' : '') + '</div>';
      html += item + '</div>';
    });
    html += '</div>';
  });
  grid.innerHTML = html;
  updateProgress(checked, total);
}

function updateProgress(checked, total) {
  if (checked === undefined) {
    let c = 0; let t = 0;
    Object.values(COMPRA).forEach(items => {
      if (!items) return;
      items.forEach(item => { t++; if (checkedItems.has(item)) c++; });
    });
    checked = c; total = t;
  }
  const pct = total > 0 ? Math.round(checked / total * 100) : 0;
  const bar = document.getElementById('progressBar');
  const lbl = document.getElementById('progressLabel');
  if (bar) bar.style.width = pct + '%';
  if (lbl) lbl.textContent = checked + ' de ' + total + ' artículos marcados';
}

function toggleItem(item) {
  if (checkedItems.has(item)) {
    checkedItems.delete(item);
    compraRef.child(item.replace(/[.#$/\[\]]/g, '_')).remove();
  } else {
    checkedItems.add(item);
    compraRef.child(item.replace(/[.#$/\[\]]/g, '_')).set(true);
  }
  rebuildCompraUI();
}

function resetCompra() {
  checkedItems.clear();
  compraRef.remove();
  rebuildCompraUI();
}

function printCompra() {
  let printHTML = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Lista de la Compra - Mes 6</title>';
  printHTML += '<style>body{font-family:sans-serif;padding:20px;font-size:13px;} h1{font-size:18px;margin-bottom:16px;} .cat{margin-bottom:14px;} .cat-title{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#555;margin-bottom:6px;border-bottom:1px solid #ddd;padding-bottom:3px;} .item{padding:4px 0;display:flex;align-items:center;gap:8px;} .item.done{text-decoration:line-through;color:#aaa;} .box{width:14px;height:14px;border:1px solid #888;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;} .box.chk{background:#0F766E;border-color:#0F766E;color:white;}</style>';
  printHTML += '</head><body><h1>Lista de la Compra — Dieta Mes 6</h1>';
  Object.keys(COMPRA).forEach(cat => {
    const items = COMPRA[cat];
    if (!items || items.length === 0) return;
    printHTML += '<div class="cat"><div class="cat-title">' + cat + '</div>';
    items.forEach(item => {
      const done = checkedItems.has(item);
      printHTML += '<div class="item' + (done ? ' done' : '') + '"><div class="box' + (done ? ' chk' : '') + '">' + (done ? '✓' : '') + '</div>' + item + '</div>';
    });
    printHTML += '</div>';
  });
  printHTML += '</body></html>';
  const blob = new Blob([printHTML], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

compraRef.on('value', (snapshot) => {
  checkedItems.clear();
  if (snapshot.exists()) {
    snapshot.forEach(child => {
      const key = child.key;
      Object.values(COMPRA).forEach(items => {
        if (!items) return;
        items.forEach(item => {
          if (item.replace(/[.#$/\[\]]/g, '_') === key) checkedItems.add(item);
        });
      });
    });
  }
  rebuildCompraUI();
  updateProgress();
}, (error) => {
  rebuildCompraUI();
  updateProgress();
});

window.showView = showView;
window.selectWeekDay = selectWeekDay;
window.selectDay = selectDay;
window.toggleMeal = toggleMeal;
window.toggleItem = toggleItem;
window.resetCompra = resetCompra;
window.printCompra = printCompra;
window.rebuildCompraUI = rebuildCompraUI;

buildWeekGrid();
buildDayButtons();
selectDay('Lunes');
rebuildCompraUI();

}); // end window.addEventListener load
